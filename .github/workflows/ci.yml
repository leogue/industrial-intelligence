name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  opentofu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/opentofu
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.2
      - run: tofu fmt -check -recursive
      # Sans backend ni identifiants GCP : vérifie la syntaxe sans lire l'état ni le projet.
      - run: tofu init -backend=false -input=false
      - run: tofu validate
