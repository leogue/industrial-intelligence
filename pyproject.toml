[project]
name = "industrial-intelligence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lguerin", email = "leo.guerin.tech@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-cloud-storage>=3.17.1",
    "httpx>=0.28.1",
    "ijson>=3.6.0",
    "pyarrow>=26.0.0",
    "simplejson>=4.2.0",
]

[project.scripts]
industrial-intelligence = "industrial_intelligence:main"
rne-ingest = "industrial_intelligence.ingestion.rne.cli:main"
sirene-ingest = "industrial_intelligence.ingestion.sirene.cli:main"
bodacc-ingest = "industrial_intelligence.ingestion.bodacc.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
